services:

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - experiment-net

  order-gateway:
    build:
      context: ../src/OrderGateway/Kafka
      dockerfile: Dockerfile
    container_name: order-gateway-kafka
    ports:
      - "5020:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=orders
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    depends_on:
      - kafka
    networks:
      - experiment-net

  order-processor:
    build:
      context: ../src/OrderProcessor/Kafka
      dockerfile: Dockerfile
    container_name: order-processor-kafka
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_TOPIC=orders
      - KAFKA_GROUP_ID=order-processor-group
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    depends_on:
      - kafka
    networks:
      - experiment-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus-kafka
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.kafka.yml:/etc/prometheus/prometheus.yml
    networks:
      - experiment-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana-rest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning
      - ../observability/grafana/provisioning/dashboards-json:/etc/grafana/provisioning/dashboards-json
    depends_on:
      - prometheus
    networks:
      - experiment-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor-kafka
    ports:
      - "8090:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - experiment-net

networks:
  experiment-net:
    driver: bridge
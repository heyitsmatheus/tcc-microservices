services:

  order-gateway:
    build:
      context: ../src/OrderGateway/Http
      dockerfile: Dockerfile
    container_name: order-gateway-rest
    ports:
      - "5000:8080"
    environment:
      - PROCESSOR_URL=http://order-processor:8080
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    depends_on:
      - order-processor
    networks:
      - experiment-net

  order-processor:
    build:
      context: ../src/OrderProcessor/Http
      dockerfile: Dockerfile
    container_name: order-processor-rest
    ports:
      - "5001:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    networks:
      - experiment-net

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus-rest
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.rest.yml:/etc/prometheus/prometheus.yml
    networks:
      - experiment-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana-rest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning
      - ../observability/grafana/provisioning/dashboards-json:/etc/grafana/provisioning/dashboards-json
    depends_on:
      - prometheus
    networks:
      - experiment-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor-rest
    ports:
      - "8090:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - experiment-net

networks:
  experiment-net:
    driver: bridge